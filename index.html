<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noah’s Stuff — Meme HQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>

    <main class="page">
      <section class="hero">
        <h1>Noah’s Stuff</h1>
        <p class="subtitle">The internet’s most important meme HQ</p>
      </section>

      <section class="video-card">
        <div class="video-wrap">
          <iframe
            id="yt-player"
            title="Random meme video player"
            src="about:blank"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>
        </div>

        <p id="video-title" class="video-title">Loading meme greatness...</p>

        <button id="another-btn" type="button">Another One 🎲</button>
      </section>

      <footer class="footer">Powered by memes</footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
