name: Validate assistant voting actions

on:
  push:
    branches:
      - feature/assistant-voting-rule-actions

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHP syntax
        run: |
          php -l app/Services/IpCreditorVotingOverrideService.php
          php -l app/Services/JinxAssistantService.php
          php -l app/Http/Controllers/JinxAssistantController.php
          php -l app/Http/Controllers/LeadIpVotingController.php
          php -l database/migrations/2026_09_21_230600_create_ip_creditor_voting_override_audits.php
          php -l tests/Unit/IpCreditorVotingOverrideServiceTest.php

      - name: Compile routes and views
        run: |
          php artisan route:list > /dev/null
          php artisan view:cache

      - name: Voting action tests
        run: |
          php artisan test tests/Unit/IpCreditorVotingServiceTest.php
          php artisan test tests/Unit/IpCreditorVotingOverrideServiceTest.php
