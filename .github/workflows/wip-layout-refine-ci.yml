name: WIP Layout Refine CI

on:
  push:
    branches:
      - build/wip-layout-refine

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - name: Compile Blade views
        run: php artisan view:cache
      - name: Run focused tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
        run: php artisan test tests/Feature/Wip/WipWorkingStackTest.php tests/Feature/Wip/HandleRemarketingResponseEventTest.php --stop-on-failure
