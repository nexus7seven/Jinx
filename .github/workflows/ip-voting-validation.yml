name: Validate IP voting overhaul

on:
  push:
    branches:
      - feature/ip-voting-overhaul

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHP syntax
        run: |
          php -l app/Services/IpCreditorVotingService.php
          php -l app/Http/Controllers/LeadIpVotingController.php
          php -l app/Models/Lead.php
          php -l routes/web.php
          php -l database/migrations/2026_09_21_220000_add_iva_ip_voting_to_leads.php
          php -l tests/Unit/IpCreditorVotingServiceTest.php

      - name: Compile routes and views
        run: |
          php artisan route:list > /dev/null
          php artisan view:cache

      - name: Voting interpretation tests
        run: php artisan test tests/Unit/IpCreditorVotingServiceTest.php
