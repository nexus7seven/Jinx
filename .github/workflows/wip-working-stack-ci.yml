name: WIP Working Stack CI

on:
  push:
    branches:
      - build/wip-working-stack

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - name: Lint changed PHP
        run: |
          php -l app/Models/WipCaseQueueItem.php
          php -l app/Models/Lead.php
          php -l app/Services/WipCaseQueueService.php
          php -l app/Http/Controllers/WipController.php
          php -l database/migrations/2026_09_21_001000_create_wip_case_queue_items_table.php
          php -l tests/Feature/Wip/WipWorkingStackTest.php
      - name: Compile Blade views
        run: php artisan view:cache
      - name: Run focused tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
        run: php artisan test tests/Feature/Wip/WipWorkingStackTest.php tests/Feature/Wip/HandleRemarketingResponseEventTest.php --stop-on-failure
