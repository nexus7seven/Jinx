name: Reasoning CI

on:
  push:
    branches:
      - build/case-readiness-registry

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Lint changed PHP
        run: |
          php -l app/Services/DecisionFactRegistryService.php
          php -l app/Services/DecisionCaseReadinessService.php
          php -l app/Services/DecisionDynamicRuleService.php
          php -l app/Services/DecisionCaseFactService.php
          php -l app/Services/IvaCasePackagingPlannerService.php
          php -l app/Services/IvaDecisionEngineService.php
          php -l app/Services/PropertyDecisionService.php
          php -l app/Services/JinxAgentToolService.php
          php -l app/Services/JinxAgentService.php
          php -l app/Services/JinxAssistantService.php
          php -l app/Http/Controllers/JinxAssistantController.php
          php -l database/migrations/2026_09_20_001000_create_reasoning_fact_registry.php

      - name: Run reasoning acceptance tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
        run: php artisan test tests/Feature/DecisionReadinessRegistryTest.php tests/Feature/JinxAssistantAcceptanceTest.php tests/Feature/DecisionEngineTest.php --stop-on-failure
